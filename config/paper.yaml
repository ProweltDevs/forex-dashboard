# Paper trading (default). Fills are simulated; no broker orders are ever sent.
mode: paper
data_dir: data
logging:
  level: INFO
  json: true
accounts:
  - id: paper-main
    broker: paper
    symbols: [EURUSD, GBPUSD, XAUUSD]
    paper:
      starting_balance: "10000"
      currency: USD
      leverage: 100
      slippage_points: 0
      latency_ms: 0
      commission_per_lot: "0"
      # market_data_from: ctrader-demo   # uncomment to drive paper fills from a real demo feed
