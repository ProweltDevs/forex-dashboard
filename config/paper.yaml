# Paper trading (default). Fills are simulated; no broker orders are ever sent.
mode: paper
data_dir: data
logging:
  level: INFO
  json: true
market_data:
  timeframes: [M1, M5, M15, H1]
  price_source: bid            # broker candles are bid-based
  day_offset_minutes: 0        # -120 = trading days/weeks start 22:00 UTC (NY close / UTC+2 server)
  bar_history: 1000
  bar_grace_ms: 2000           # wait this long after a bar's end for late ticks
  warmup_bars: 300
  stale: {min_silence_s: 15, max_silence_s: 120, multiplier: 20}
  recorder: {enabled: true, batch_size: 5000, flush_interval_s: 10}
# Control API (SPEC §13, docs/api/README.md): REST + the /stream WebSocket, for the UI and scripts.
# Bearer token from TRADER_API_TOKEN (.env, at least 32 characters). Localhost only: put a TLS reverse proxy
# in front if you need it elsewhere. Every mutating call is written to the audit log.
api:
  enabled: false
  host: 127.0.0.1
  port: 8700
  stream_tick_interval_ms: 500   # per-client tick throttle on /stream
# Notifications (SPEC §14, docs/notifications.md). Telegram is primary, email optional. Secrets from .env:
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (a private chat with your bot), TRADER_SMTP_USER/PASSWORD.
notify:
  # telegram: {min_severity: info, commands: true}     # commands: /status /pnl /pause /kill
  # email: {host: smtp.example.com, port: 587, sender: trader@example.com, recipients: [me@example.com],
  #         min_severity: warning}
  dedupe_s: 300                  # the same alert within 5 min is sent once
  rate_per_min: 20               # per channel; extras are summarised (critical alerts always go out)
  fills: true                    # a message per fill (SL/TP hits and closes are always sent)
accounts:
  - id: paper-main
    broker: paper
    symbols: [EURUSD, GBPUSD, XAUUSD]
    paper:
      starting_balance: "10000"
      currency: USD
      leverage: 100
      hedging: true              # false = netting (one position per symbol)
      slippage_points: 0         # adverse ticks on market/stop fills
      extra_spread_points: 0     # widen the source spread (ticks)
      latency_ms: 0              # ACK -> execution delay
      commission_per_lot: "0"    # account currency, per side
      swap_long_per_lot: "0"     # account currency per lot per night
      swap_short_per_lot: "0"
      rollover_hour_utc: 21
      # rate_limit: {rate_per_s: 50, burst: 50}   # emulate broker-side request limits
      # Prices: a seeded random walk so paper mode runs without broker credentials. It is NOT market data:
      # use it to exercise the platform, never to judge a strategy. For real prices, remove synthetic_feed and
      # set market_data_from to a demo account defined in this file (it is then used for prices only).
      synthetic_feed: {seed: 1, tick_interval_ms: 250}
      # market_data_from: ctrader-demo
    risk:                          # built-in defaults; every field is listed in config/live.yaml.example
      limits: {}
      strategies: {}               # per-strategy overrides

# Strategy instances (SPEC §8). class: a built-in (ema_cross, donchian_breakout, rsi_reversion) or
# "package.module:ClassName". params are validated by the strategy's Params model. Timeframes must be
# listed in market_data.timeframes. With the synthetic feed there is no candle history, so strategies warm
# up from live bars (e.g. EMA 26 on M5 trades after about two hours).
strategies:
  - id: ema-cross-eurusd-m5
    class: ema_cross
    account: paper-main
    symbols: [EURUSD]
    timeframes: [M5]
    params: {fast: 12, slow: 26, atr_period: 14, atr_stop: "2", atr_target: "3", risk_pct: "0.5"}
  - id: donchian-gbpusd-m15
    class: donchian_breakout
    account: paper-main
    symbols: [GBPUSD]
    timeframes: [M15]
    params: {period: 20, atr_period: 14, exit_after_bars: 16, risk_pct: "0.5"}
  - id: rsi-xauusd-m5
    class: rsi_reversion
    account: paper-main
    symbols: [XAUUSD]
    timeframes: [M5]
    params: {rsi_period: 14, oversold: "30", overbought: "70", risk_pct: "0.25"}
