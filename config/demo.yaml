# Broker DEMO accounts. Secrets come from .env via secrets_ref (see .env.example).
mode: demo
logging:
  level: INFO
  json: true
accounts:
  - id: ctrader-demo
    broker: ctrader
    environment: demo
    account_id: "0000000"          # numeric ctidTraderAccountId (run `uv run trader ctrader-auth`)
    secrets_ref: CTRADER_DEMO      # CTRADER_DEMO_CLIENT_ID/_CLIENT_SECRET/_ACCESS_TOKEN/_REFRESH_TOKEN
    symbols: [EURUSD, GBPUSD, XAUUSD]
    ctrader:
      symbol_aliases: {}           # broker symbol name -> canonical, e.g. {"GOLD": "XAUUSD"}
    # Risk uses the built-in defaults (all listed in config/live.yaml.example). Override only what you need:
    risk:
      strategies: {}               # e.g. {scalper: {max_order_volume: "0.2", require_sl: false}}
      # proxy: http://proxy:3128   # only if your network needs an HTTP CONNECT proxy
  - id: exness-demo
    broker: exness
    environment: demo
    account_id: "0000000"          # numeric Exness trading account id (a DEMO account)
    secrets_ref: EXNESS_DEMO       # EXNESS_DEMO_API_KEY + EXNESS_DEMO_PRIVATE_KEY (or _PRIVATE_KEY_FILE)
    symbols: [EURUSD, XAUUSD]
    exness:
      gateway_url: https://replace-with-dns-widget-host.invalid   # Gateway host from Key Management
      symbol_suffix: ""            # e.g. "m" if instruments are named EURUSDm
      symbol_aliases: {}
      hedging: true

# Strategies on the DEMO accounts (warm-up comes from broker candles, so they trade from the first bar).
strategies:
  - id: ema-cross-ctrader-eurusd-m5
    class: ema_cross
    account: ctrader-demo
    symbols: [EURUSD]
    timeframes: [M5]
    params: {fast: 12, slow: 26, risk_pct: "0.25"}
  - id: donchian-ctrader-gbpusd-m15
    class: donchian_breakout
    account: ctrader-demo
    symbols: [GBPUSD]
    timeframes: [M15]
    params: {period: 20, exit_after_bars: 16, risk_pct: "0.25"}
  - id: rsi-exness-xauusd-m5
    class: rsi_reversion
    account: exness-demo
    symbols: [XAUUSD]
    timeframes: [M5]
    params: {risk_pct: "0.25"}
