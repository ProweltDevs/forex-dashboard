[project]
name = "trader"
version = "0.1.0"
description = "Personal algorithmic trading platform for forex/CFDs (Exness, cTrader, paper)."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2",
    "python-ulid>=3.0",
    "structlog>=24.4",
    "protobuf>=7.35",
    "httpx>=0.27",
    "cryptography>=43",
    "websockets>=14",
    "pyarrow>=17",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "prometheus-client>=0.21",
]

[project.scripts]
trader = "trader.cli:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "mypy-protobuf>=3.6",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "types-protobuf>=5.28",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    "*.md",  # never reformat code blocks in docs (SPEC.md is hand-written)
    "src/trader/brokers/ctrader/proto",  # generated protobuf bindings
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "DTZ",   # no naive datetimes
    "T20",   # no print() outside the CLI
    "PT",    # pytest style
    "TID",   # banned imports
    "TD", "FIX",  # TODOs need an issue reference
]
ignore = [
    "TD002",  # TODO author tag not required; TD003 (issue link) IS enforced
    "N818",  # error names are fixed by CLAUDE.md (Requote, MarketClosed, ...)
]

[tool.ruff.lint.per-file-ignores]
"src/trader/cli.py" = ["T20"]
"tests/**" = ["T20"]
"tests/integration/ctrader_fake.py" = ["E501"]  # a protocol fixture: long message literals read better
"tests/integration/exness_fake.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "Naive datetime. Use trader.domain.time.utc_now() or ctx.now()."
"datetime.datetime.utcfromtimestamp".msg = "Naive datetime. Use trader.domain.time.from_epoch_ms()."

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["trader"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["trader.brokers.ctrader.proto.*"]
ignore_errors = true  # generated; the .pyi stubs still type-check callers

[[tool.mypy.overrides]]
module = ["trader.domain.*", "trader.oms.*"]
disallow_any_explicit = true
disallow_any_expr = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "demo: contract/probe tests against broker DEMO accounts (network, needs creds in .env)",
    "chaos: phase 11 chaos suite (real processes killed, connections dropped); runs in CI",
]
filterwarnings = ["error"]
